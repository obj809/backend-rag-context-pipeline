name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The query engine is the pinned `rag-engine` package, installed from its
      # public Git repo via requirements.txt — no sibling checkout, no bridge.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      # CPU-only torch — the PyPI default on Linux drags in multi-GB CUDA libs
      # the tests (and CI runners) can't use.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      # Pulls rag-engine from GitHub (the runner has git; public repo, no token).
      - run: pip install -r requirements.txt -r requirements-dev.txt

      - run: python -m pytest
